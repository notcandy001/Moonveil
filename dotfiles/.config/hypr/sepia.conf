# ── hyprland.conf — sepia desktop snippet ────────────────────────────────────
# Source this from your main hyprland.conf:
#   source = ~/.config/hypr/sepia.conf

# ── General colors ────────────────────────────────────────────────────────────
general {
  col.active_border   = rgba(1a1510ff)
  col.inactive_border = rgba(b8a89888)
  border_size         = 1
  gaps_in             = 6
  gaps_out            = 12
  layout              = dwindle
}

decoration {
  rounding        = 0
  blur {
    enabled       = false
  }
  shadow {
    enabled       = true
    range         = 8
    render_power  = 2
    color         = rgba(1a150940)
    color_inactive = rgba(1a150920)
  }
  active_opacity   = 1.0
  inactive_opacity = 0.95
}

animations {
  enabled = true
  bezier = sepia, 0.25, 0.1, 0.25, 1.0
  animation = windows,    1, 3,  sepia, popin 90%
  animation = windowsOut, 1, 3,  sepia, popin 90%
  animation = fade,       1, 3,  sepia
  animation = workspaces, 1, 4,  sepia, slide
}

# ── Font / misc ───────────────────────────────────────────────────────────────
misc {
  force_default_wallpaper = 0
  disable_hyprland_logo   = true
}

# ── EWW window rules — float + pin all widgets ────────────────────────────────
windowrulev2 = float,         class:^(eww)$
windowrulev2 = nofocus,       class:^(eww)$
windowrulev2 = noblur,        class:^(eww)$
windowrulev2 = noshadow,      class:^(eww)$
windowrulev2 = noborder,      class:^(eww)$
windowrulev2 = pin,           class:^(eww)$
windowrulev2 = noanim,        class:^(eww)$

# Pin each widget to exact position (matches eww geometry)
windowrulev2 = move 16 80,    class:^(eww)$, title:^(mood-widget)$
windowrulev2 = size 400 180,  class:^(eww)$, title:^(mood-widget)$

windowrulev2 = move 16 278,   class:^(eww)$, title:^(cava-widget)$
windowrulev2 = size 400 130,  class:^(eww)$, title:^(cava-widget)$

windowrulev2 = move 50% 180,  class:^(eww)$, title:^(clock-widget)$
windowrulev2 = size 200 250,  class:^(eww)$, title:^(clock-widget)$

windowrulev2 = move 440 545,  class:^(eww)$, title:^(nowplaying-widget)$
windowrulev2 = size 280 190,  class:^(eww)$, title:^(nowplaying-widget)$

# ── Kitty window rules ────────────────────────────────────────────────────────
windowrulev2 = opacity 0.96 0.94, class:^(kitty)$

# ── Startup — launch EWW widgets + cava ──────────────────────────────────────
exec-once = mkfifo $XDG_RUNTIME_DIR/cava-eww.fifo
exec-once = cava -p ~/.config/cava/config
exec-once = eww daemon
exec-once = eww open mood-widget
exec-once = eww open cava-widget
exec-once = eww open clock-widget
exec-once = eww open nowplaying-widget
exec-once = waybar
