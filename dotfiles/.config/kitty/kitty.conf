# ── Kitty sepia theme — wabi-sabi ────────────────────────────────────────────

font_family      Sarasa Mono J
bold_font        Sarasa Mono J Bold
italic_font      Sarasa Mono J Italic
bold_italic_font Sarasa Mono J Bold Italic
font_size        12.0

# Cursor
cursor                  #1a1510
cursor_text_color       #e8ddd0
cursor_shape            block
cursor_blink_interval   0

# Background / foreground
background              #e8ddd0
foreground              #1a1510
selection_background    #1a1510
selection_foreground    #e8ddd0

# Window
window_padding_width    14
hide_window_decorations yes
background_opacity      0.96

# ── 16-color palette (sepia-ink) ──────────────────────────────────────────────
# black
color0  #1a1510
color8  #5c4a38
# red
color1  #7a2020
color9  #a03030
# green
color2  #2a5a2a
color10 #3a7a3a
# yellow
color3  #7a6010
color11 #a08020
# blue
color4  #20406a
color12 #2a5a8a
# magenta
color5  #5a2060
color13 #7a3080
# cyan
color6  #1a5a5a
color14 #2a7a7a
# white
color7  #c8bdb0
color15 #e8ddd0

# Misc
enable_audio_bell       no
window_border_width     1pt
active_border_color     #1a1510
inactive_border_color   #b8a898
tab_bar_style           hidden
